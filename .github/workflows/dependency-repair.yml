name: Temporary backend dependency repair

on:
  push:
    branches:
      - fix/release-readiness-2026-10-30
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  refresh:
    # Run only against this repository's controlled repair branch.
    if: github.repository == 'abrarjawadabir2/luna-care'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Update patched direct dependencies and regenerate lockfile
        working-directory: backend
        run: |
          npm install --save-exact fastify@5.12.7 zod@4.6.7 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      # Typecheck, explicit test discovery and audit must pass before lockfile commit.
      - name: Verify refreshed dependencies
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): regenerate audited backend dependency lockfile"
            git push origin HEAD:fix/release-readiness-2026-10-30
          fi
