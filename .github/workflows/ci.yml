name: LunaCare CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: 'Base64-encoded Android upload keystore (.jks) for signed tag releases'
        required: false
      ANDROID_STORE_PASSWORD:
        description: 'Keystore password for the Android upload keystore'
        required: false
      ANDROID_KEY_PASSWORD:
        description: 'Key password for the upload key alias'
        required: false

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  ANDROID_COMPILE_SDK: '37'

jobs:
  # ==========================================
  # INFRASTRUCTURE & TERRAFORM VALIDATION
  # ==========================================
  infrastructure-validation:
    name: Terraform and infrastructure security validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Verify local infrastructure guardrails
        run: |
          python3 -m unittest discover -s infra/aws/tests -p 'test_*.py'
          python3 -m unittest discover -s infra/cloudflare/tests -p 'test_*.py'
      - name: Check Terraform formatting
        run: |
          terraform -chdir=infra/aws/terraform fmt -check -no-color
          terraform -chdir=infra/cloudflare/terraform fmt -check -no-color
      - name: Validate AWS Terraform without credentials or plan/apply
        working-directory: infra/aws/terraform
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
      - name: Validate Cloudflare Terraform without credentials or plan/apply
        working-directory: infra/cloudflare/terraform
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  # ==========================================
  # PUBLIC WEB STATIC & REAL BROWSER CHECKS
  # ==========================================
  web-static-check:
    name: Public HTML smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate standalone public landing page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, tag, attrs):
                  self.tags.append((tag, dict(attrs)))

          source = Path("web/index.html").read_text(encoding="utf-8")
          page = Page()
          page.feed(source)
          assert page.tags[0][0] == "html" or any(tag == "html" for tag, _ in page.tags)
          assert any(tag == "html" and attrs.get("lang") for tag, attrs in page.tags)
          assert any(tag == "meta" and attrs.get("name") == "description" for tag, attrs in page.tags)
          assert any(tag == "meta" and attrs.get("http-equiv") == "Content-Security-Policy" for tag, attrs in page.tags)
          assert any(tag == "meta" and attrs.get("http-equiv") == "X-Content-Type-Options" for tag, attrs in page.tags)
          assert any(tag == "h1" for tag, _ in page.tags)
          assert not any(tag == "form" for tag, _ in page.tags)
          assert not any(tag == "script" and attrs.get("src") for tag, attrs in page.tags)
          print("Standalone HTML structure checked successfully.")
          PY
      - name: Attach downloadable HTML
        uses: actions/upload-artifact@v7
        with:
          name: lunacare-html-landing-page
          path: web/index.html
          if-no-files-found: error
          retention-days: 30

  web-browser-journeys:
    name: Public website real-browser user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real Chromium interactions on mobile and desktop
        run: python web/tests/test_user_journeys.py
      - name: Save public-only website screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lunacare-public-website-ux-screenshots
          path: test-results/web-ux/
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================
  # NODE.JS BACKEND TESTS
  # ==========================================
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Run Tests
        working-directory: backend
        run: npm test
      - name: Build Bundle
        working-directory: backend
        run: npm run build
      - name: Security Audit
        working-directory: backend
        run: npm audit

  # ==========================================
  # RUST FILE INSPECTOR TESTS
  # ==========================================
  rust-test:
    name: Rust Security Worker Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        working-directory: backend-rust
        run: cargo fmt --check
      - name: Clippy Warnings Check
        working-directory: backend-rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Tests
        working-directory: backend-rust
        run: cargo test

  # ==========================================
  # 1. ANDROID LINT
  # ==========================================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Install Android SDK Platform ${{ env.ANDROID_COMPILE_SDK }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_COMPILE_SDK}"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run Lint
        run: ./gradlew lint
      - name: Upload lint results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  # ==========================================
  # 2. ANDROID UNIT TESTS
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Install Android SDK Platform ${{ env.ANDROID_COMPILE_SDK }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_COMPILE_SDK}"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

  # ==========================================
  # 3. SECURITY AUDIT & DOCUMENT CONVERTER
  # ==========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # MarkItDown's pinned NumPy requires Python >= 3.12.
          python-version: '3.12'
      - name: Verify security audit evidence handling
        run: |
          python -m unittest discover -s scripts -p 'test_audit_evidence.py'
      - name: Verify MarkItDown local document converter security tests
        run: |
          python -m pip install -r scripts/requirements-markitdown.txt
          python -m pip check
          python -m unittest discover -s scripts -p 'test_convert_document.py' -v
          python -m unittest discover -s scripts -p 'test_user_simulation_100x.py' -v
      - name: Run Python security audit script (synthetic self-test only)
        run: |
          python scripts/audit_security.py --dry-run
          rm -f audit_report.json
      - name: Test and generate local-only code index
        run: |
          python -m unittest discover -s scripts -p 'test_index_codebase.py'
          python scripts/index_codebase.py
          test -f docs-private/code-index.json
          test -f docs-private/CODE_INDEX.md
          test -z "$(git ls-files docs-private)"
          # Keep generated private indexes only on the ephemeral runner.
          # Do not upload them as Actions artifacts or commit them.
      - name: Check for hardcoded secrets
        run: |
          if grep -rn --include="*.kt" -E "(password|secret|api_key|apikey|hardcoded)" app/src/main/ \
            | grep -v "securityPin" \
            | grep -v "// " \
            | grep -v "\.env" \
            | grep -iE "=\s*\"[A-Za-z0-9+/]{8,}\""; then
            echo "❌ Possible hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
      - name: Verify no diagnosis claims in content
        run: |
          if grep -rn --include="*.kt" -iE "(you have PCOS|you are diagnosed|diagnose you)" app/src/main/; then
            echo "❌ Potential diagnosis claim found — violates safety rules!"
            exit 1
          fi
          echo "✅ No diagnosis claims found"
      - name: Verify no medication dosage in content
        run: |
          if grep -rn --include="*.kt" -iE "(take [0-9]+ mg|dosage:|dose:|prescribed [0-9]+)" app/src/main/; then
            echo "❌ Potential medication dosage found!"
            exit 1
          fi
          echo "✅ No medication dosage found"
      - name: Verify GPS coordinates not stored in Room entities
        run: |
          if grep -rn --include="*.kt" -E "(val lat|val lng|val latitude|val longitude|val coordinates)" \
            app/src/main/java/com/example/data/Entities.kt; then
            echo "❌ GPS coordinates found in Room entities — privacy violation!"
            exit 1
          fi
          echo "✅ No GPS coordinates stored in entities"

  # ==========================================
  # 4. BUILD DEBUG APK (Gated by ALL checks)
  # ==========================================
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs:
      - infrastructure-validation
      - web-static-check
      - web-browser-journeys
      - backend-test
      - rust-test
      - lint
      - test
      - security-audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Install Android SDK Platform ${{ env.ANDROID_COMPILE_SDK }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_COMPILE_SDK}"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lunacare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 5. SIGNED RELEASE BUILD (version tags only)
  # ==========================================
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Install Android SDK Platform ${{ env.ANDROID_COMPILE_SDK }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_COMPILE_SDK}"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Validate signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_STORE_PASSWORD secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD secret'; exit 1; }
          (
            umask 077
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/lunacare-upload.jks"
          )
          test -s "$RUNNER_TEMP/lunacare-upload.jks" || { echo 'Decoded keystore is empty or invalid'; exit 1; }
      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lunacare-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify release APK and AAB signing
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo 'Missing ANDROID_HOME / ANDROID_SDK_ROOT'; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo 'apksigner not found in Android SDK build-tools'; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > /dev/null
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lunacare-upload.jks"
      - name: Upload signed Android release builds
        uses: actions/upload-artifact@v7
        with:
          name: lunacare-signed-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
