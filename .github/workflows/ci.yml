name: LunaCare CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  web-static-check:
    name: Public HTML smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate standalone public landing page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, tag, attrs):
                  self.tags.append((tag, dict(attrs)))

          source = Path("web/index.html").read_text(encoding="utf-8")
          page = Page()
          page.feed(source)
          assert page.tags[0][0] == "html" or any(tag == "html" for tag, _ in page.tags)
          assert any(tag == "html" and attrs.get("lang") for tag, attrs in page.tags)
          assert any(tag == "meta" and attrs.get("name") == "description" for tag, attrs in page.tags)
          assert any(tag == "h1" for tag, _ in page.tags)
          assert not any(tag == "form" for tag, _ in page.tags)
          assert not any(tag == "script" and attrs.get("src") for tag, attrs in page.tags)
          print("Standalone HTML structure checked successfully.")
          PY
      - name: Attach downloadable HTML
        uses: actions/upload-artifact@v4
        with:
          name: lunacare-html-landing-page
          path: web/index.html
          if-no-files-found: error
          retention-days: 30

  # ==========================================
  # NODE.JS BACKEND TESTS
  # ==========================================
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Run Tests
        working-directory: backend
        run: npm test
      - name: Build Bundle
        working-directory: backend
        run: npm run build
      - name: Security Audit
        working-directory: backend
        run: npm audit

  # ==========================================
  # RUST FILE INSPECTOR TESTS
  # ==========================================
  rust-test:
    name: Rust Security Worker Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        working-directory: backend-rust
        run: cargo fmt --check
      - name: Clippy Warnings Check
        working-directory: backend-rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Tests
        working-directory: backend-rust
        run: cargo test
  # ==========================================
  # 1. LINT
  # ==========================================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run Lint
        run: ./gradlew lint
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  # ==========================================
  # 2. UNIT TESTS
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Run Unit Tests
        run: ./gradlew test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

  # ==========================================
  # 3. SECURITY AUDIT
  # ==========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python security audit script
        run: |
          python scripts/audit_security.py --dry-run
      - name: Test and generate local-only code index
        run: |
          python -m unittest discover -s scripts -p 'test_index_codebase.py'
          python scripts/index_codebase.py
          test -f docs-private/code-index.json
          test -f docs-private/CODE_INDEX.md
          test -z "$(git ls-files docs-private)"
          # Keep generated private indexes only on the ephemeral runner.
          # Do not upload them as Actions artifacts or commit them.
      - name: Check for hardcoded secrets
        run: |
          # Fail if any hardcoded password/key patterns are found in source
          if grep -rn --include="*.kt" -E "(password|secret|api_key|apikey|hardcoded)" app/src/main/ \
            | grep -v "securityPin" \
            | grep -v "// " \
            | grep -v "\.env" \
            | grep -iE "=\s*\"[A-Za-z0-9+/]{8,}\""; then
            echo "❌ Possible hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
      - name: Verify no diagnosis claims in content
        run: |
          if grep -rn --include="*.kt" -iE "(you have PCOS|you are diagnosed|diagnose you)" app/src/main/; then
            echo "❌ Potential diagnosis claim found — violates safety rules!"
            exit 1
          fi
          echo "✅ No diagnosis claims found"
      - name: Verify no medication dosage in content
        run: |
          if grep -rn --include="*.kt" -iE "(take [0-9]+ mg|dosage:|dose:|prescribed [0-9]+)" app/src/main/; then
            echo "❌ Potential medication dosage found!"
            exit 1
          fi
          echo "✅ No medication dosage found"
      - name: Verify GPS coordinates not stored in Room entities
        run: |
          if grep -rn --include="*.kt" -E "(val lat|val lng|val latitude|val longitude|val coordinates)" \
            app/src/main/java/com/example/data/Entities.kt; then
            echo "❌ GPS coordinates found in Room entities — privacy violation!"
            exit 1
          fi
          echo "✅ No GPS coordinates stored in entities"

  # ==========================================
  # 4. BUILD DEBUG APK
  # ==========================================
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test, security-audit, backend-test, rust-test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunacare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 5. SIGNED RELEASE BUILD (version tags only)
  # ==========================================
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Validate signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lunacare-upload.jks"
          chmod 600 "$RUNNER_TEMP/lunacare-upload.jks"
      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lunacare-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify release APK signing
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
      - name: Upload signed Android release builds
        uses: actions/upload-artifact@v4
        with:
          name: lunacare-signed-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
