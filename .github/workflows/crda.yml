# Dependency Vulnerability Analytics & SARIF Code Scanning
#
# Replaces the deprecated/retired Red Hat CRDA action (`redhat-actions/crda@v1`
# and `redhat-actions/openshift-tools-installer@v1`, whose backend service
# `gw.api.openshift.io` was shut down) and removes the unsafe
# `pull_request_target` trigger and retired `CRDA_KEY`/`SNYK_TOKEN` secrets.
#
# Uses Google OSV-Scanner and GitHub Dependency Review to scan all LunaCare
# ecosystems (`gradle/libs.versions.toml`, `backend/package-lock.json`,
# `backend-rust/Cargo.lock`, and `scripts/requirements-markitdown.txt`) and
# publish SARIF results to GitHub Security -> Code Scanning.

name: Dependency Vulnerability Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  osv-scan:
    name: Multi-Ecosystem OSV SARIF Scan
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: true
      fail-on-vuln: true

  osv-scan-pr:
    name: Pull Request OSV Delta Scan
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true

  dependency-review:
    name: GitHub Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes for vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
